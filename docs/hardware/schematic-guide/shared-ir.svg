<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850">
  <title>Rev B-IR 共用红外光头原理图示意</title>
  <desc>显示 CH582M、U12 选择器、TFBS4650 级收发器、Q_IR/R_IR、可选 MCP2120 以及 IR_RX_RAW 共用接收节点。</desc>
  <defs>
    <style>
      .bg{fill:#fbfafb}.title{font:700 25px "Microsoft YaHei",sans-serif;fill:#172033}.sub{font:14px "Microsoft YaHei",sans-serif;fill:#526071}
      .mcu{fill:#edf8ef;stroke:#5a9d72;stroke-width:2}.mux{fill:#f1edff;stroke:#8370c4;stroke-width:2}.opt{fill:#fff;stroke:#9aa7b7;stroke-width:2;stroke-dasharray:7 5}.ir{fill:#fff0f1;stroke:#c56f79;stroke-width:2}.power{fill:#fff4df;stroke:#d99438;stroke-width:2}.note{fill:#fff;stroke:#c8d1dc;stroke-width:1.4;stroke-dasharray:5 4}
      .head{font:700 17px "Microsoft YaHei",sans-serif;fill:#172033}.text{font:13px "Microsoft YaHei",sans-serif;fill:#526071}.pin{font:12px "Consolas",monospace;fill:#526071}.tx{fill:none;stroke:#ba6c16;stroke-width:3;marker-end:url(#arrow-tx)}.rx{fill:none;stroke:#2f74a7;stroke-width:3;marker-end:url(#arrow-rx)}.ctrl{fill:none;stroke:#875d8f;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#arrow-ctrl)}.powerline{fill:none;stroke:#c06d19;stroke-width:3;marker-end:url(#arrow-tx)}.gnd{stroke:#3e4b60;stroke-width:2}.label-tx{font:700 13px "Consolas",monospace;fill:#a35c12}.label-rx{font:700 13px "Consolas",monospace;fill:#2b638f}.label-ctrl{font:700 13px "Consolas",monospace;fill:#754879}.legend{font:12px "Microsoft YaHei",sans-serif;fill:#526071}
    </style>
    <marker id="arrow-tx" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ba6c16"/></marker>
    <marker id="arrow-rx" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f74a7"/></marker>
    <marker id="arrow-ctrl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#875d8f"/></marker>
  </defs>
  <rect class="bg" width="1450" height="850"/>
  <text class="title" x="42" y="43">P08 共用红外光头：标准 IrDA 与 38 kHz 遥控共用一扇光窗</text>
  <text class="sub" x="42" y="70">TX 路径用橙色，RX 原始脉冲用蓝色，模式控制用紫色。U9 内部已经包含 IRED、PIN 光电二极管和接收 ASIC。</text>

  <!-- MCU -->
  <g transform="translate(45,125)">
    <rect class="mcu" width="285" height="315" rx="12"/><text class="head" x="142" y="31" text-anchor="middle">U1 CH582M</text>
    <text class="text" x="20" y="70">PB7 / UART0 TX</text><text class="label-tx" x="20" y="89">IR_TX_STD</text>
    <text class="text" x="20" y="125">PB0 / PWM6</text><text class="label-tx" x="20" y="144">IR_TX_CARRIER</text>
    <text class="text" x="20" y="180">PB1 / 捕获输入</text><text class="label-rx" x="20" y="199">IR_RX_CAPTURE</text>
    <text class="text" x="20" y="235">PB3 / 模式选择</text><text class="label-ctrl" x="20" y="254">IR_TX_SEL_CODEC_EN</text>
    <text class="text" x="20" y="290">PB2：MCP2120 MODE</text><text class="text" x="20" y="309">PB19：U9 SD</text>
  </g>

  <!-- U12 -->
  <g transform="translate(430,125)">
    <rect class="mux" width="320" height="250" rx="12"/><text class="head" x="160" y="31" text-anchor="middle">U12 SN74LVC2G157</text><text class="text" x="20" y="62">通道 A：标准 TX 选择</text><text class="text" x="20" y="84">A0=PB7，A1=可选 MCP TXIR</text><text class="text" x="20" y="118">通道 B：遥控载波选择</text><text class="text" x="20" y="140">B0=PB0/PWM6，B1=安全低</text><text class="text" x="20" y="174">S ← PB3；G ← 明确使能电平</text><text class="text" x="20" y="198">Y_A → U9 TXD</text><text class="text" x="20" y="220">Y_B → Q_IR_GATE</text></g>
  <path class="tx" d="M330 195 H430"/><text class="label-tx" x="342" y="181">IR_TX_STD</text>
  <path class="tx" d="M330 270 H390 V245 H430"/><text class="label-tx" x="342" y="259">IR_TX_CARRIER</text>
  <path class="ctrl" d="M330 375 H390 V340 H430"/><text class="label-ctrl" x="338" y="365">SELECT / G</text>

  <!-- MCP optional -->
  <g transform="translate(430,485)">
    <rect class="opt" width="320" height="175" rx="12"/><text class="head" x="160" y="31" text-anchor="middle">U10 MCP2120（可选 DNP）</text><text class="text" x="20" y="65">TXIR → IR_TX_MCP → U12-A</text><text class="text" x="20" y="91">RXIR ← IR_RX_RAW</text><text class="text" x="20" y="117">MODE ← PB2；EN 有默认电平</text><text class="text" x="20" y="143">BAUD0/1/2、OSC1/OSC2</text></g>
  <path class="tx" d="M750 548 H825 V245 H750"/><text class="label-tx" x="760" y="532">IR_TX_MCP</text>

  <!-- U9 -->
  <g transform="translate(930,130)">
    <rect class="ir" width="300" height="370" rx="14"/><text class="head" x="150" y="31" text-anchor="middle">U9 TFBS4650 级</text><text class="text" x="20" y="62">pin 1 IREDA ← R_IR</text><text class="text" x="20" y="88">pin 2 IREDC → Q_IR(D)</text><text class="text" x="20" y="114">pin 3 TXD ← IR_TXD_U9</text><text class="text" x="20" y="140">pin 4 RXD → IR_RX_RAW</text><text class="text" x="20" y="166">pin 5 SD ← IRDA_SD</text><text class="text" x="20" y="192">pin 6 VCC ← 3V3</text><text class="text" x="20" y="218">pin 7 GND</text><rect x="72" y="255" width="156" height="78" rx="39" fill="#ffe6c7" stroke="#d99438" stroke-width="2"/><text class="head" x="150" y="287" text-anchor="middle" font-size="14">一个光窗</text><text class="text" x="150" y="309" text-anchor="middle" font-size="12">IRED + PIN + ASIC</text></g>
  <path class="tx" d="M750 245 H840 V244 H930"/><text class="label-tx" x="790" y="229">IR_TXD_U9</text>
  <path class="rx" d="M930 270 H825 V270 H750"/><text class="label-rx" x="795" y="256">IR_RX_RAW</text>
  <path class="ctrl" d="M330 415 H820 V296 H930"/><text class="label-ctrl" x="650" y="400">IRDA_SD</text>

  <!-- RX branch -->
  <circle cx="825" cy="270" r="6" fill="#2f74a7"/>
  <path class="rx" d="M825 270 V665 H750"/><text class="label-rx" x="770" y="650">RXIR</text>
  <path class="rx" d="M825 270 V455 H350 V305 H330"/><text class="label-rx" x="470" y="445">PB1 / IR_RX_CAPTURE</text>

  <!-- current sink -->
  <path class="powerline" d="M1080 500 V555"/>
  <g transform="translate(1000,555)"><rect class="power" width="160" height="75" rx="10"/><text class="head" x="80" y="29" text-anchor="middle">R_IR</text><text class="text" x="80" y="52" text-anchor="middle">峰值/热计算</text></g>
  <path class="powerline" d="M1080 555 V500"/>
  <text class="label-tx" x="1088" y="534">IR_VCC2</text>
  <path class="powerline" d="M1160 500 V615 H1240"/>
  <g transform="translate(1160,615)"><rect class="power" width="160" height="100" rx="10"/><text class="head" x="80" y="30" text-anchor="middle">Q_IR NMOS</text><text class="text" x="80" y="55" text-anchor="middle">D ← IREDC</text><text class="text" x="80" y="76" text-anchor="middle">S → GND</text></g>
  <path class="ctrl" d="M750 345 H900 V665 H1160"/><text class="label-ctrl" x="870" y="650">Q_IR_GATE</text>
  <path class="gnd" d="M1240 715 v28 m-18 0 h36 m-12 8 h24 m-12 8 h12"/>

  <g transform="translate(45,735)"><rect class="note" width="1180" height="70" rx="10"/><text class="head" x="18" y="28">半双工和学习规则</text><text class="text" x="18" y="52">发射期间 RXD 会回显/饱和；固件屏蔽回显，发送结束后留出约 150 µs 接收恢复时间。遥控学习记录 IR_RX_RAW 原始边沿，不能把它当 TSOP 已解调包络。</text></g>
  <g transform="translate(1260,735)"><line x1="0" y1="8" x2="28" y2="8" stroke="#ba6c16" stroke-width="3"/><text class="legend" x="38" y="13">TX</text><line x1="0" y1="32" x2="28" y2="32" stroke="#2f74a7" stroke-width="3"/><text class="legend" x="38" y="37">RX</text><line x1="0" y1="56" x2="28" y2="56" stroke="#875d8f" stroke-width="2" stroke-dasharray="7 5"/><text class="legend" x="38" y="61">控制</text></g>
</svg>
