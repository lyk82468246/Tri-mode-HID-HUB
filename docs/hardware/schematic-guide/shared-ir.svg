<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img">
  <title>Rev B-IR 共用红外光头直接连接原理图示意</title>
  <desc>PB7 直接连接 TFBS4650 TXD，在 MCU 内部 UART0 与 PWM9 之间切换；RXD 直接连接 PB4，可选分支到 PB1；IREDC/Q_IR/R_IR 与 MCP2120 是可选 DNP 支路，不使用外部运行时多路器。</desc>
  <defs>
    <style>
      .bg{fill:#fbfafb}.title{font:700 25px "Microsoft YaHei",sans-serif;fill:#172033}.sub{font:14px "Microsoft YaHei",sans-serif;fill:#526071}
      .mcu{fill:#edf8ef;stroke:#5a9d72;stroke-width:2}.mode{fill:#eef4ff;stroke:#5c83bd;stroke-width:2}.opt{fill:#fff;stroke:#9aa7b7;stroke-width:2;stroke-dasharray:7 5}.ir{fill:#fff0f1;stroke:#c56f79;stroke-width:2}.note{fill:#fff;stroke:#c8d1dc;stroke-width:1.4;stroke-dasharray:5 4}
      .head{font:700 17px "Microsoft YaHei",sans-serif;fill:#172033}.text{font:13px "Microsoft YaHei",sans-serif;fill:#526071}.tx{fill:none;stroke:#ba6c16;stroke-width:3;marker-end:url(#arrow-tx)}.rx{fill:none;stroke:#2f74a7;stroke-width:3;marker-end:url(#arrow-rx)}.ctrl{fill:none;stroke:#875d8f;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#arrow-ctrl)}.optline{fill:none;stroke:#71808d;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow-opt)}.label-tx{font:700 13px "Consolas",monospace;fill:#a35c12}.label-rx{font:700 13px "Consolas",monospace;fill:#2b638f}.label-ctrl{font:700 13px "Consolas",monospace;fill:#754879}.legend{font:12px "Microsoft YaHei",sans-serif;fill:#526071}
    </style>
    <marker id="arrow-tx" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ba6c16"/></marker>
    <marker id="arrow-rx" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f74a7"/></marker>
    <marker id="arrow-ctrl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#875d8f"/></marker>
    <marker id="arrow-opt" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#71808d"/></marker>
  </defs>
  <rect class="bg" width="1500" height="850"/>
  <text class="title" x="42" y="43">P08 共用红外光头：PB7 直连，UART0 / PWM9 由 MCU 内部切换</text>
  <text class="sub" x="42" y="70">橙色为发射，蓝色为接收原始脉冲，紫色为安全控制，灰色虚线为可选 DNP。触摸不进入这页。</text>

  <g transform="translate(45,125)">
    <rect class="mcu" width="360" height="355" rx="12"/>
    <text class="head" x="180" y="31" text-anchor="middle">U1 CH582M</text>
    <text class="text" x="20" y="70">PB7 / TXD0 / PWM9</text><text class="label-tx" x="20" y="89">IR_TXD_U9</text>
    <text class="text" x="20" y="130">PB4 / RXD0</text><text class="label-rx" x="20" y="149">IR_RX_RAW</text>
    <text class="text" x="20" y="190">PB1（可选输入捕获）</text><text class="label-rx" x="20" y="209">IR_RX_CAPTURE</text>
    <text class="text" x="20" y="250">PB0 / PWM6（可选）</text><text class="label-ctrl" x="20" y="269">IR_EXT_SINK_GATE</text>
    <text class="text" x="20" y="310">PB19 / U9 SD</text><text class="label-ctrl" x="20" y="329">IRDA_SD</text>
  </g>

  <g transform="translate(495,125)">
    <rect class="mode" width="430" height="210" rx="12"/>
    <text class="head" x="215" y="31" text-anchor="middle">同一 PB7 的 MCU 内部功能</text>
    <text class="text" x="24" y="70">标准 IrDA</text><text class="label-tx" x="24" y="91">UART0 TX → SIR 脉冲</text>
    <text class="text" x="24" y="132">家电遥控</text><text class="label-tx" x="24" y="153">PWM9 / 定时器 → 38 kHz + 包络</text>
    <text class="text" x="24" y="185">同一时刻只启用一种输出；不需要 SN74LVC2G157</text>
  </g>

  <g transform="translate(1030,125)">
    <rect class="ir" width="300" height="380" rx="14"/>
    <text class="head" x="150" y="31" text-anchor="middle">U9 TFBS4650 级</text>
    <text class="text" x="20" y="62">pin 1 IREDA ← IR_VCC2</text>
    <text class="text" x="20" y="88">pin 2 IREDC → 可选 Q_IR</text>
    <text class="text" x="20" y="114">pin 3 TXD ← IR_TXD_U9</text>
    <text class="text" x="20" y="140">pin 4 RXD → IR_RX_RAW</text>
    <text class="text" x="20" y="166">pin 5 SD ← IRDA_SD</text>
    <text class="text" x="20" y="192">pin 6 VCC ← 3V3</text>
    <text class="text" x="20" y="218">pin 7 GND</text>
    <rect x="72" y="255" width="156" height="78" rx="39" fill="#ffe6c7" stroke="#d99438" stroke-width="2"/>
    <text class="head" x="150" y="287" text-anchor="middle" font-size="14">一个光窗</text>
    <text class="text" x="150" y="309" text-anchor="middle" font-size="12">IRED + PIN + ASIC</text>
  </g>

  <!-- The direct TX net goes above the explanatory box so the arrow and text never overlap it. -->
  <path class="tx" d="M405 214 V92 H1000 V239 H1030"/>
  <text class="label-tx" x="575" y="84">PB7 / IR_TXD_U9：唯一 TX 物理线</text>

  <!-- RX returns below the mode box and branches only to high-impedance inputs. -->
  <path class="rx" d="M1030 265 H955 V515 H405 V270"/>
  <text class="label-rx" x="660" y="502">IR_RX_RAW → PB4 / RXD0</text>
  <path class="rx" d="M955 515 V370 H430 V330 H405"/>
  <text class="label-rx" x="570" y="361">可选高阻/0 Ω → PB1</text>
  <path class="ctrl" d="M405 454 H985 V291 H1030"/>
  <text class="label-ctrl" x="655" y="443">PB19 / IRDA_SD（高=关断）</text>

  <g transform="translate(45,560)">
    <rect class="opt" width="360" height="170" rx="12"/>
    <text class="head" x="180" y="31" text-anchor="middle">U10 MCP2120（可选 DNP）</text>
    <text class="text" x="20" y="65">TXIR → IR_TX_MCP</text>
    <text class="text" x="20" y="91">RXIR ← IR_RX_RAW（高阻）</text>
    <text class="text" x="20" y="117">TX 源用 R_TX_MCU / R_TX_MCP 0 Ω 二选一</text>
    <text class="text" x="20" y="143">不是运行时多路器，也不是必需芯片</text>
  </g>
  <path class="optline" d="M405 625 H470 V92 H1000"/><text class="legend" x="418" y="611">可选 TX 源</text>
  <path class="optline" d="M955 515 H900 V755 H430 V650 H405"/><text class="legend" x="670" y="746">可选 RXIR（高阻）</text>

  <g transform="translate(520,560)">
    <rect class="opt" width="360" height="170" rx="12"/>
    <text class="head" x="180" y="31" text-anchor="middle">IREDC / Q_IR / R_IR（可选 DNP）</text>
    <text class="text" x="20" y="65">IREDA ← R_IR ← IR_VCC2（按脉冲电流计算）</text>
    <text class="text" x="20" y="91">IREDC → Q_IR(D)，Q_IR(S) → GND</text>
    <text class="text" x="20" y="117">PB0/PWM6 → 22–100 Ω → Q_IR(G)</text>
    <text class="text" x="20" y="143">仅在直接 TXD 光强不足时装配</text>
  </g>
  <path class="optline" d="M405 394 H475 V640 H520"/><text class="legend" x="420" y="625">可选栅极</text>
  <path class="optline" d="M1180 505 V640 H880"/><text class="legend" x="1090" y="625">IREDC</text>

  <g transform="translate(930,560)">
    <rect class="note" width="430" height="170" rx="10"/>
    <text class="head" x="18" y="29">绘图边界</text>
    <text class="text" x="18" y="57">• PB7/PB4 是基线直连，不画 U12。</text>
    <text class="text" x="18" y="83">• 标准 IrDA、遥控发射、学习接收按时间互斥。</text>
    <text class="text" x="18" y="109">• PB18/PB22/PB23 触摸/复位在 P10 独立。</text>
    <text class="text" x="18" y="135">• 发射期间屏蔽 RXD 回显，结束后等待恢复。</text>
  </g>

  <g transform="translate(45,785)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#ba6c16" stroke-width="3"/><text class="legend" x="38" y="13">TX</text>
    <line x1="80" y1="8" x2="108" y2="8" stroke="#2f74a7" stroke-width="3"/><text class="legend" x="118" y="13">RX</text>
    <line x1="160" y1="8" x2="188" y2="8" stroke="#875d8f" stroke-width="2" stroke-dasharray="7 5"/><text class="legend" x="198" y="13">安全控制</text>
    <line x1="300" y1="8" x2="328" y2="8" stroke="#71808d" stroke-width="2" stroke-dasharray="7 5"/><text class="legend" x="338" y="13">可选 DNP</text>
  </g>
</svg>
