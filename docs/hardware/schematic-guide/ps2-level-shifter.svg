<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="700" viewBox="0 0 1250 700">
  <title>PS/2 双向开漏电平转换原理图示意</title>
  <desc>显示一个 Mini-DIN-6 PS/2 端口的 DATA/CLK 两路 BSS138 双向电平转换，另一路鼠标端口复制相同结构。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 25px "Microsoft YaHei",sans-serif;fill:#172033}.sub{font:14px "Microsoft YaHei",sans-serif;fill:#526071}
      .port{fill:#eaf4ff;stroke:#5790c7;stroke-width:2}.hv{fill:#fff4df;stroke:#d99438;stroke-width:2}.lv{fill:#edf8ef;stroke:#5a9d72;stroke-width:2}.mos{fill:#fff0f1;stroke:#c56f79;stroke-width:2}.note{fill:#fff;stroke:#c8d1dc;stroke-width:1.4;stroke-dasharray:5 4}
      .head{font:700 17px "Microsoft YaHei",sans-serif;fill:#172033}.text{font:13px "Microsoft YaHei",sans-serif;fill:#526071}.net{font:700 13px "Consolas",monospace;fill:#2e638f}.wire{fill:none;stroke:#3e78aa;stroke-width:3;marker-end:url(#arrow)}.power{fill:none;stroke:#c06d19;stroke-width:3;marker-end:url(#arrow)}.ctrl{fill:none;stroke:#9c5b8e;stroke-width:2;stroke-dasharray:6 5}.pin{font:12px "Consolas",monospace;fill:#526071}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3e78aa"/></marker>
  </defs>
  <rect class="bg" width="1250" height="700"/>
  <text class="title" x="40" y="43">P06 两路 PS/2：一条总线的完整画法</text>
  <text class="sub" x="40" y="70">下图以键盘口为例；鼠标口复制 DATA/CLK/上拉/电平转换结构，分别使用 5V_PS2_M 和 PA2/PA3。</text>

  <!-- connector -->
  <g transform="translate(45,170)"><rect class="port" width="185" height="245" rx="12"/><text class="head" x="92" y="31" text-anchor="middle">J3 Mini-DIN-6</text><text class="text" x="20" y="70">1 DATA</text><text class="text" x="20" y="99">3 GND</text><text class="text" x="20" y="128">4 +5V</text><text class="text" x="20" y="157">5 CLK</text><text class="text" x="20" y="190">2/6 NC</text><text class="pin" x="20" y="220">脚序按最终 mating-face</text></g>
  <path class="power" d="M230 298 H290"/><text class="net" x="235" y="283">5V_PS2_K</text>
  <path class="wire" d="M230 230 H290"/><text class="net" x="235" y="215">KBD_DATA_5V</text>
  <path class="wire" d="M230 355 H290"/><text class="net" x="235" y="340">KBD_CLK_5V</text>
  <path d="M138 415 v30 m-18 0 h36 m-12 8 h24 m-12 8 h12" stroke="#3e4b60" stroke-width="2"/><text class="text" x="100" y="492">pin 3 / 壳体 → GND</text>

  <!-- pullups and protection -->
  <g transform="translate(290,85)"><rect class="hv" width="215" height="120" rx="12"/><text class="head" x="107" y="30" text-anchor="middle">5 V 侧</text><text class="text" x="18" y="61">R_H_DATA：2.2–4.7 kΩ</text><text class="text" x="18" y="83">R_H_CLK：2.2–4.7 kΩ</text><text class="text" x="18" y="105">可选 ESD / 33–100 Ω</text></g>
  <path class="power" d="M340 298 V205"/><text class="pin" x="300" y="535">5 V 上拉不能反灌 3V3</text>

  <!-- data lane -->
  <g transform="translate(530,150)"><rect class="mos" width="260" height="145" rx="12"/><text class="head" x="130" y="31" text-anchor="middle">Q1 BSS138</text><text class="text" x="20" y="62">HV：KBD_DATA_5V</text><text class="text" x="20" y="84">LV：KBD_DATA_MCU</text><text class="text" x="20" y="106">G：3V3</text><text class="text" x="20" y="128">双向、开漏、拉低/释放</text></g>
  <path class="wire" d="M290 230 H530"/><path class="wire" d="M790 220 H930"/>
  <text class="net" x="806" y="205">KBD_DATA_MCU</text>
  <g transform="translate(930,150)"><rect class="lv" width="260" height="145" rx="12"/><text class="head" x="130" y="31" text-anchor="middle">U1 CH582M</text><text class="text" x="20" y="62">PA1：DATA</text><text class="text" x="20" y="84">R_L_DATA：2.2–4.7 kΩ → 3V3</text><text class="text" x="20" y="106">GPIO 只拉低或释放</text></g>

  <!-- clock lane -->
  <g transform="translate(530,365)"><rect class="mos" width="260" height="145" rx="12"/><text class="head" x="130" y="31" text-anchor="middle">Q2 BSS138</text><text class="text" x="20" y="62">HV：KBD_CLK_5V</text><text class="text" x="20" y="84">LV：KBD_CLK_MCU</text><text class="text" x="20" y="106">G：3V3</text><text class="text" x="20" y="128">与 Q1 相同拓扑</text></g>
  <path class="wire" d="M290 355 H530"/><path class="wire" d="M790 435 H930"/>
  <text class="net" x="806" y="420">KBD_CLK_MCU</text>
  <g transform="translate(930,365)"><rect class="lv" width="260" height="145" rx="12"/><text class="head" x="130" y="31" text-anchor="middle">U1 CH582M</text><text class="text" x="20" y="62">PA0：CLK</text><text class="text" x="20" y="84">R_L_CLK：2.2–4.7 kΩ → 3V3</text><text class="text" x="20" y="106">GPIO 只拉低或释放</text></g>

  <g transform="translate(290,550)"><rect class="note" width="900" height="85" rx="10"/><text class="head" x="18" y="29">复制为 J4 鼠标口</text><text class="text" x="18" y="55">J4 DATA/CLK → MOUSE_DATA_5V/MOUSE_CLK_5V → Q3/Q4 BSS138 → MOUSE_DATA_MCU/MOUSE_CLK_MCU → PA3/PA2。</text><text class="text" x="18" y="75">两路 5 V 供电应从 5V_HOST 分支，并在需要时各自增加限流/关断；禁止 GPIO 推挽输出高电平。</text></g>
</svg>
