<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="700" viewBox="0 0 1250 700">
  <title>USB 与 RS232 原理图连接示意</title>
  <desc>显示 USB-C 设备、USB-A 主机和 DB9 RS232 三条独立信号链，强调 ESD、差分对和 MAX3232E 电平转换。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 25px "Microsoft YaHei",sans-serif;fill:#172033}.sub{font:14px "Microsoft YaHei",sans-serif;fill:#526071}
      .port{fill:#eaf4ff;stroke:#5790c7;stroke-width:2}.prot{fill:#fff4df;stroke:#d99438;stroke-width:2}.mcu{fill:#edf8ef;stroke:#5a9d72;stroke-width:2}.rs{fill:#fff0f1;stroke:#c56f79;stroke-width:2}.note{fill:#fff;stroke:#c8d1dc;stroke-width:1.4;stroke-dasharray:5 4}
      .head{font:700 17px "Microsoft YaHei",sans-serif;fill:#172033}.text{font:13px "Microsoft YaHei",sans-serif;fill:#526071}.net{font:700 13px "Consolas",monospace;fill:#2e638f}.wire{fill:none;stroke:#3e78aa;stroke-width:3;marker-end:url(#arrow)}.wire-rs{fill:none;stroke:#b25560;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#8797ad;stroke-width:2;stroke-dasharray:6 5}.pin{font:12px "Consolas",monospace;fill:#526071}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3e78aa"/></marker>
  </defs>
  <rect class="bg" width="1250" height="700"/>
  <text class="title" x="40" y="43">P01 / P05 / P07 接口信号链</text>
  <text class="sub" x="40" y="70">每条链路都按“连接器 → 保护/转换 → MCU”绘制；USB 差分对和 RS232 电气层不能混用。</text>

  <!-- USB device -->
  <g transform="translate(45,115)"><rect class="port" width="195" height="145" rx="12"/><text class="head" x="97" y="31" text-anchor="middle">J1 USB-C 设备口</text><text class="text" x="18" y="61">VBUS → VBUS_RAW</text><text class="text" x="18" y="83">A6/B6：D+</text><text class="text" x="18" y="105">A7/B7：D−</text><text class="text" x="18" y="127">CC1/CC2：各 5.1 kΩ Rd</text></g>
  <path class="wire" d="M240 185 H315"/><text class="net" x="245" y="170">D+/D−</text>
  <g transform="translate(315,135)"><rect class="prot" width="175" height="105" rx="12"/><text class="head" x="87" y="30" text-anchor="middle">ESD_DEV</text><text class="text" x="18" y="59">低电容 USB ESD</text><text class="text" x="18" y="81">靠近连接器放置</text></g>
  <path class="wire" d="M490 185 H590"/><text class="net" x="510" y="170">USB_DEV_DP/DN_MCU</text>
  <g transform="translate(590,115)"><rect class="mcu" width="240" height="145" rx="12"/><text class="head" x="120" y="31" text-anchor="middle">U1 CH582M</text><text class="text" x="20" y="64">PB11：USB_DEV_DP</text><text class="text" x="20" y="88">PB10：USB_DEV_DN</text><text class="text" x="20" y="112">90 Ω 差分走线</text></g>
  <g transform="translate(870,135)"><rect class="note" width="330" height="105" rx="10"/><text class="head" x="18" y="29">设备口画图检查</text><text class="text" x="18" y="57">VBUS 只进电源/PA7 分压，不进 MCU 电源脚</text><text class="text" x="18" y="79">22 Ω 串阻只作为按参考设计调整的预留</text></g>

  <!-- USB host -->
  <g transform="translate(45,335)"><rect class="port" width="195" height="145" rx="12"/><text class="head" x="97" y="31" text-anchor="middle">J2 USB-A 主机口</text><text class="text" x="18" y="61">pin 1：VBUS_HOST</text><text class="text" x="18" y="83">pin 2：D−</text><text class="text" x="18" y="105">pin 3：D+</text><text class="text" x="18" y="127">pin 4：GND</text></g>
  <path class="wire" d="M240 405 H315"/><text class="net" x="245" y="390">D+/D−</text>
  <g transform="translate(315,355)"><rect class="prot" width="175" height="105" rx="12"/><text class="head" x="87" y="30" text-anchor="middle">ESD_HOST</text><text class="text" x="18" y="59">低电容 USB ESD</text><text class="text" x="18" y="81">连接器侧优先</text></g>
  <path class="wire" d="M490 405 H590"/><text class="net" x="505" y="390">USB_HOST_DP/DN_MCU</text>
  <g transform="translate(590,335)"><rect class="mcu" width="240" height="145" rx="12"/><text class="head" x="120" y="31" text-anchor="middle">U1 CH582M</text><text class="text" x="20" y="64">PB13：USB_HOST_DP</text><text class="text" x="20" y="88">PB12：USB_HOST_DN</text><text class="text" x="20" y="112">Host 控制器先使能</text></g>
  <g transform="translate(870,355)"><rect class="prot" width="330" height="105" rx="10"/><text class="head" x="18" y="29">VBUS_HOST 另一路</text><text class="text" x="18" y="57">TPS2553 OUT → J2 pin 1</text><text class="text" x="18" y="79">HOST_EN 默认低，FAULT# 开漏上拉</text></g>

  <!-- RS232 -->
  <g transform="translate(45,555)"><rect class="port rs" width="195" height="105" rx="12"/><text class="head" x="97" y="30" text-anchor="middle">J5 DB9 公座</text><text class="text" x="18" y="59">pin 2：RS232_RX_DB9</text><text class="text" x="18" y="81">pin 3：RS232_TX_DB9</text><text class="text" x="18" y="103">pin 5：GND</text></g>
  <path class="wire-rs" d="M240 608 H315"/><text class="net" x="245" y="593" fill="#a04955">RS232 电平</text>
  <g transform="translate(315,550)"><rect class="rs" width="315" height="120" rx="12"/><text class="head" x="157" y="30" text-anchor="middle">U6 MAX3232E</text><text class="text" x="18" y="58">R1IN ← DB9 pin 2；R1OUT → PA8</text><text class="text" x="18" y="80">T1IN ← PA9；T1OUT → DB9 pin 3</text><text class="text" x="18" y="102">C1+/−、C2+/−、V+/V− 按料号补齐</text></g>
  <path class="wire-rs" d="M630 608 H730"/><text class="net" x="642" y="593" fill="#a04955">RS232_RX/TX_TTL</text>
  <g transform="translate(730,555)"><rect class="mcu" width="240" height="105" rx="12"/><text class="head" x="120" y="30" text-anchor="middle">U1 CH582M</text><text class="text" x="20" y="59">PA8：RS232_RX_TTL</text><text class="text" x="20" y="81">PA9：RS232_TX_TTL</text></g>
  <g transform="translate(1000,555)"><rect class="note" width="200" height="105" rx="10"/><text class="head" x="18" y="30">禁止事项</text><text class="text" x="18" y="58">DB9 不可直接接 3.3 V UART</text><text class="text" x="18" y="80">RS232 TVS 贴近连接器</text></g>
</svg>
