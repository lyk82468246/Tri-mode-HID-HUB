<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img"><title>CH582M Rev B-M PCB 与 3D 打印底板剖面概念</title>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#e6c778" stroke-width="2"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#60748b"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif">
<rect x="0.00" y="0.00" width="1500.00" height="900.00" rx="0" fill="#f7f9fc" stroke="none" />
<text x="55.00" y="52.00" font-size="30" fill="#243447" text-anchor="start" font-weight="700" >CH582M · PCB / 电池盆地 / 3D 打印结构剖面</text>
<text x="55.00" y="83.00" font-size="16" fill="#627186" text-anchor="start" font-weight="400" >Rev B-M / 2026-09-30   ·   非比例机械示意   ·   需用最终封装、螺丝和电池实物收口</text>
<text x="55.00" y="112.00" font-size="15" fill="#627186" text-anchor="start" font-weight="400" >上方是用户面；底层 OLED/触摸朝上，顶层器件和 CH582M 朝下进入盆地。</text>
<rect x="300.00" y="145.00" width="900.00" height="62.00" rx="10" fill="#e5f4fb" stroke="#2d7c9f" stroke-width="2"/>
<text x="750.00" y="171.00" font-size="19" fill="#24627f" text-anchor="middle" font-weight="700" >用户面 / PCB 底层：OLED + 触摸（脸朝上）</text>
<text x="750.00" y="192.00" font-size="12" fill="#24627f" text-anchor="middle" font-weight="400" >窗口、FPC 和触摸走线由底层图单独收口</text>
<rect x="280.00" y="255.00" width="940.00" height="38.00" rx="4" fill="#d6ad63" stroke="#8b6524" stroke-width="2"/>
<text x="750.00" y="279.00" font-size="17" fill="#6b4b18" text-anchor="middle" font-weight="700" >FR-4 PCB 基材 / 4 层板</text>
<polyline points="280.00,250.00 1220.00,250.00" fill="none" stroke="#b06e28" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" />
<text x="750.00" y="244.00" font-size="12" fill="#89531e" text-anchor="middle" font-weight="400" >底层铜 ↑     顶层铜 ↓</text>
<rect x="330.00" y="303.00" width="110.00" height="120.00" rx="6" fill="#dff2ec" stroke="#637783" stroke-width="1.8"/>
<text x="385.00" y="331.00" font-size="13" fill="#536772" text-anchor="middle" font-weight="700" >PS/2 / 侧插座</text>
<text x="385.00" y="351.00" font-size="10" fill="#687984" text-anchor="middle" font-weight="400" >向墙体开口</text>
<rect x="490.00" y="303.00" width="90.00" height="92.00" rx="6" fill="#edf0f5" stroke="#637783" stroke-width="1.8"/>
<text x="535.00" y="331.00" font-size="13" fill="#536772" text-anchor="middle" font-weight="700" >弯插排母</text>
<text x="535.00" y="351.00" font-size="10" fill="#687984" text-anchor="middle" font-weight="400" >向墙体开口</text>
<rect x="1010.00" y="303.00" width="112.00" height="132.00" rx="6" fill="#e4efff" stroke="#637783" stroke-width="1.8"/>
<text x="1066.00" y="331.00" font-size="13" fill="#536772" text-anchor="middle" font-weight="700" >USB / DB9 / 光学头</text>
<text x="1066.00" y="351.00" font-size="10" fill="#687984" text-anchor="middle" font-weight="400" >向墙体开口</text>
<rect x="1165.00" y="303.00" width="70.00" height="112.00" rx="6" fill="#f3eadd" stroke="#637783" stroke-width="1.8"/>
<text x="1200.00" y="331.00" font-size="13" fill="#536772" text-anchor="middle" font-weight="700" >电源 / 高件</text>
<text x="1200.00" y="351.00" font-size="10" fill="#687984" text-anchor="middle" font-weight="400" >向墙体开口</text>
<rect x="690.00" y="303.00" width="120.00" height="70.00" rx="8" fill="#263b45" stroke="#172d36" stroke-width="2"/>
<text x="750.00" y="331.00" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700" >U1 CH582M</text>
<text x="750.00" y="351.00" font-size="11" fill="#c8e1da" text-anchor="middle" font-weight="400" >标记面朝盆地</text>
<rect x="690.00" y="392.00" width="120.00" height="30.00" rx="7" fill="#fff2cf" stroke="#bd8e27" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="750.00" y="411.00" font-size="11" fill="#8a620f" text-anchor="middle" font-weight="700" >禁压 / 绝缘缓冲</text>
<rect x="545.00" y="460.00" width="410.00" height="82.00" rx="12" fill="#fffdf5" stroke="#c99842" stroke-width="2"/>
<text x="750.00" y="490.00" font-size="21" fill="#946b1e" text-anchor="middle" font-weight="700" >1S Li-ion 电池 / 中央盆地</text>
<text x="750.00" y="515.00" font-size="12" fill="#946b1e" text-anchor="middle" font-weight="400" >保护板 + 泡棉托盘；不接触焊点、U1、电感或金属螺丝</text>
<text x="750.00" y="534.00" font-size="10" fill="#946b1e" text-anchor="middle" font-weight="400" >电芯尺寸与 z 向余量尚未冻结</text>
<rect x="180.00" y="640.00" width="1140.00" height="42.00" rx="5" fill="#e0d2c4" stroke="#806c5a" stroke-width="2"/>
<text x="750.00" y="666.00" font-size="17" fill="#665545" text-anchor="middle" font-weight="700" >3D 打印底板：电池托盘 / 屏幕窗口 / 排线避让</text>
<rect x="180.00" y="420.00" width="44.00" height="220.00" rx="4" fill="#e0d2c4" stroke="#806c5a" stroke-width="2"/>
<rect x="1276.00" y="420.00" width="44.00" height="220.00" rx="4" fill="#e0d2c4" stroke="#806c5a" stroke-width="2"/>
<polyline points="250.00,420.00 250.00,615.00 1250.00,615.00 1250.00,420.00" fill="none" stroke="#9a8a79" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" />
<text x="116.00" y="440.00" font-size="12" fill="#665545" text-anchor="start" font-weight="700" >四面墙</text>
<text x="116.00" y="459.00" font-size="11" fill="#665545" text-anchor="start" font-weight="400" >非导电材料</text>
<polyline points="300.00,255.00 300.00,640.00" fill="none" stroke="#566873" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3" />
<circle cx="300" cy="268" r="13" fill="#d9e1e6" stroke="#344955" stroke-width="2"/>
<circle cx="300" cy="640" r="13" fill="#d9e1e6" stroke="#344955" stroke-width="2"/>
<text x="300.00" y="235.00" font-size="11" fill="#465b67" text-anchor="middle" font-weight="700" >H1 / H3</text>
<text x="300.00" y="706.00" font-size="10" fill="#465b67" text-anchor="middle" font-weight="400" >螺丝 / 支柱 / 螺母座</text>
<polyline points="1200.00,255.00 1200.00,640.00" fill="none" stroke="#566873" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3" />
<circle cx="1200" cy="268" r="13" fill="#d9e1e6" stroke="#344955" stroke-width="2"/>
<circle cx="1200" cy="640" r="13" fill="#d9e1e6" stroke="#344955" stroke-width="2"/>
<text x="1200.00" y="235.00" font-size="11" fill="#465b67" text-anchor="middle" font-weight="700" >H2 / H4</text>
<text x="1200.00" y="706.00" font-size="10" fill="#465b67" text-anchor="middle" font-weight="400" >螺丝 / 支柱 / 螺母座</text>
<rect x="55.00" y="735.00" width="1390.00" height="112.00" rx="14" fill="#ffffff" stroke="#dce3ed" />
<text x="80.00" y="767.00" font-size="18" fill="#243447" text-anchor="start" font-weight="700" >机械收口条件</text>
<text x="80.00" y="793.00" font-size="13" fill="#536575" text-anchor="start" font-weight="400" >1. H1–H4 贯穿 PCB 与底板；先选 M2.5/M3、垫片、支柱和热熔螺母，再反推孔径、焊盘和 keep-out。</text>
<text x="80.00" y="816.00" font-size="13" fill="#536575" text-anchor="start" font-weight="400" >2. 墙体用非导电、非碳纤材料；USB/DB9/PS2/光学头/弯插排母要有独立开口，天线保留净空。</text>
<text x="80.00" y="839.00" font-size="13" fill="#536575" text-anchor="start" font-weight="400" >3. 电池可放中央，但必须以实物电芯、泡棉、压力、触摸灵敏度和温升测试验证 z 向余量。</text>
</g></svg>