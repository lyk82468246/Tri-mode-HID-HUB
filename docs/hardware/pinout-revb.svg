<text x="55.00" y="1180.00" font-size="17" fill="#243447" text-anchor="start" font-weight="400" >USB2 占 PB13/PB12；调试占 PB15/PB14；复位/下载占 PB23/PB22；这些引脚不能再给其他接口。</text>
<text x="55.00" y="1210.00" font-size="16" fill="#627186" text-anchor="start" font-weight="400" >本表是布局提案，不表示云端原理图或现有固件已经更新。所有排针信号均为 3.3 V 逻辑。</text>
